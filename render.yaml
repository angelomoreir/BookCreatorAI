services:
  - type: web
    name: bookcreatorai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: bookcreatorai-db
          property: connectionString

databases:
  - name: bookcreatorai-db
    plan: free
