services:
  - type: web
    name: bookcreatorai
    env: python
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      # External Postgres (Neon free tier - no expiry).
      # Set manually in the Render dashboard: postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
